<!-- The macOS app icon: the rune of nerthus.svg on a tile of the logo's
     yellow, in the rounded-square shape of macOS app icons (macOS 26 puts
     icons of any other shape on a light tile of this shape). The tile is an
     824 square with continuous corners of radius 210; src/app_icon.rs and
     packaging/package-macos.sh draw it with the 100/1024 margin of Apple's
     icon grid. The rune keeps its proportions from the logo: the logo's
     200-unit canvas, scaled by 4.12, puts its disc inside the tile. -->
