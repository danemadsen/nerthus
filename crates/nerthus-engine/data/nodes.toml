[Aperture]
type = "Aperture"
name = "Aperture"
display_name = "Aperture"
family = "Transform"
toolbox = "Modify"
classification = "Processor"
short_code = "ap"
icon = "x-aperture"
description = "Aperture expands or compacts every feature on the terrain, similar to a camera's bokeh."
can_mask = true
members = [
    "Information",
    "Mode",
    "Size",
    "Shape",
    "VerticesCount",
    "CornerAngle",
    "Direction",
    "Antialiased",
]

[Aperture.defaults]
Information = 0
Mode = "Dilation"
Size = 0.01
Shape = "Disk"
VerticesCount = 4
CornerAngle = 90
Direction = 0
Antialiased = true

[[Aperture.parameters]]
name = "Information"
type = "byte"
kind = "Standard"
information = "PREVIEW VERSION\n\nThis is an Early Access Preview of the redesigned Aperture node. It is still subject to change, so please do not use it in production."
description = "Displays additional information or metadata about the aperture operation and its current settings."

[[Aperture.parameters]]
name = "Mode"
type = "enum"
kind = "HorizontalList"
enum = ["Dilation", "Erosion"]
enum_values = [0, 1]
separator = true
description = "Specifies the morphological operation to apply to the input, affecting how features are expanded or contracted."

[[Aperture.parameters]]
name = "Size"
type = "float"
kind = "Standard"
min = 0
max = 1
curve = [3.5]
description = "Sets the size of the structuring element (aperture) used for the operation. Larger values increase the effect's reach."

[[Aperture.parameters]]
name = "Shape"
type = "enum"
kind = "HorizontalListNoLabel"
enum = ["Disk", "Polygon", "Asterisk", "Line", "Corner"]
enum_values = [0, 1, 2, 3, 4]
description = "Determines the geometric shape of the structuring element used for dilation or erosion, affecting the style of the transformation."

[[Aperture.parameters]]
name = "VerticesCount"
type = "int"
kind = "Standard"
min = 4
max = 32
description = "For polygon shapes, sets the number of vertices (sides) used, controlling the regularity and appearance of the structuring element."

[[Aperture.parameters]]
name = "CornerAngle"
type = "int"
kind = "Standard"
min = 0
max = 180
description = "Specifies the angle of the corner for the 'Corner' shape, adjusting the sharpness or openness of the structuring element."

[[Aperture.parameters]]
name = "Direction"
type = "int"
kind = "Standard"
min = 0
max = 360
description = "Sets the orientation or direction for directional shapes (such as Line or Asterisk), controlling the angle of the effect."

[[Aperture.parameters]]
name = "Antialiased"
type = "bool"
kind = "Standard"
description = "If enabled, applies antialiasing to the aperture operation, smoothing the edges of the transformed features for a cleaner result."

[[Aperture.ports]]
name = "In"
type = "PrimaryIn, Required"
renderintent = "Default"
isexporting = true

[[Aperture.ports]]
name = "Out"
type = "PrimaryOut"
renderintent = "Default"
isexporting = true

