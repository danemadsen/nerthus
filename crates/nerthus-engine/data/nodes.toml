[Bomber]
type = "Bomber"
name = "Bomber"
display_name = "Bomber"
family = "Scatter"
toolbox = "Surface"
classification = "Processor"
short_code = "bo"
icon = "x-bomber"
description = "Bomber takes an input heightfield and \"stamps\" or bombs it across the entire terrain surface using the randomization properties you set."
flags = ["CanCreatePorts", "RequiresBaking"]
can_mask = true
members = [
    "PortCount",
    "Iterations",
    "Multiplier",
    "Size",
    "SizeDistribution",
    "Rotation",
    "MaintainProportions",
    "VariableHeight",
    "Height",
    "Distribution",
    "Jitter",
    "Seed",
    "FadeEdges",
    "BlendMode",
    "Quality",
    "AddInput",
]

[Bomber.defaults]
PortCount = 3
Iterations = 50
Multiplier = 1.0
Size = { X = 0.2, Y = 0.6 }
SizeDistribution = 0.0
Rotation = { X = 0.0, Y = 1.0 }
MaintainProportions = false
VariableHeight = false
Height = { X = 0.8, Y = 1.0 }
Distribution = "Random"
Jitter = 0.0
Seed = 59479
FadeEdges = false
BlendMode = "Max"
Quality = "Medium"
AddInput = false

[[Bomber.parameters]]
name = "Iterations"
type = "int"
kind = "Standard"
min = 2
max = 500
description = "Number of instances the bombing operation will create. Higher values increase the number of scattered elements."

[[Bomber.parameters]]
name = "Multiplier"
type = "float"
kind = "Standard"
min = 0
max = 100
curve = [2]
description = "Quickly multiply the number of bombed instances by increasing or decreasing this value, scaling the overall density."

[[Bomber.parameters]]
name = "Size"
type = "float2"
kind = "Standard"
min = 0
max = 1
description = "The minimum and maximum relative size of bombed instances, allowing for variation in the scale of each element."

[[Bomber.parameters]]
name = "SizeDistribution"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Controls the uniformity of the size of bombed instances. Higher values produce more consistent sizes, while lower values allow greater variation."

[[Bomber.parameters]]
name = "Rotation"
type = "float2"
kind = "Standard"
min = 0
max = 1
description = "The minimum and maximum range of rotations for the bombed instances, introducing random orientation for each element."

[[Bomber.parameters]]
name = "MaintainProportions"
type = "bool"
kind = "Standard"
label = "Proportional"

[[Bomber.parameters]]
name = "VariableHeight"
type = "bool"
kind = "Standard"
description = "Allows variations in the height of bombed instances, introducing additional randomness to their elevation."

[[Bomber.parameters]]
name = "Height"
type = "float2"
kind = "Standard"
min = 0
max = 1
description = "The minimum and maximum range of height variations for the bombed instances, controlling how tall or flat each element can be."

[[Bomber.parameters]]
name = "Distribution"
type = "enum"
kind = "HorizontalList"
enum = ["Random", "Grid"]
enum_values = [0, 1]
separator = true
description = "The method used to distribute bombed instances across the surface."

[[Bomber.parameters]]
name = "Jitter"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "The random offset applied to each instance while distributing, adding natural variation to their placement."

[[Bomber.parameters]]
name = "Seed"
type = "int"
kind = "Seed"
description = "The randomization pattern or seed for the node's process. Changing the seed produces different distribution patterns."

[[Bomber.parameters]]
name = "FadeEdges"
type = "bool"
kind = "Standard"
separator = true
description = "Softens the edges of bombed instances, blending them more smoothly into the base terrain."

[[Bomber.parameters]]
name = "BlendMode"
type = "enum"
kind = "Enum"
enum = ["None", "Blend", "Add", "Subtract", "Difference", "Multiply", "Screen", "Max", "Min"]
enum_values = [0, 1, 2, 3, 4, 5, 6, 7, 8]
description = "Specifies how the base terrain and bombed instances are merged together."

[[Bomber.parameters]]
name = "Quality"
type = "enum"
kind = "Enum"
enum = ["Draft", "Medium", "High"]
enum_values = [0, 1, 2]
description = "The level of quality to be used for the bombing operation. Draft is recommended for high-resolution previews, while Medium and High provide better final results."

[[Bomber.parameters]]
name = "AddInput"
type = "bool"
kind = "Command"
label = "Add Input"
command = "port-connect"
description = "Allows an additional input to be included in the bombing operation, enabling more complex or layered effects."

[[Bomber.ports]]
name = "In"
type = "PrimaryIn, Required"
renderintent = "Default"
isexporting = true

[[Bomber.ports]]
name = "Out"
type = "PrimaryOut"
renderintent = "Default"
isexporting = true

[[Bomber.ports]]
name = "Inhibition"
type = "In"
renderintent = "Default"
isexporting = true

[[Bomber.ports]]
name = "Input2"
type = "In, Required"
renderintent = "Default"
isexporting = true

