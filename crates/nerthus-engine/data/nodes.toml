[[Wizard.parameters]]
name = "Strength"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
group_start = true
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "Sets the strength of fluvial erosion. This parameter controls the sediment transport capacity, that is how much of dissolved minerals water can carry. This parameter can be set to value that is higher than 1.0, this can speed up the erosion process, but also can result in lesser erosion quality, especially if erosion softness value is high too."

[[Wizard.parameters]]
name = "Density"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "Controls the density of rock material. The softer rock is, the faster is erosion process but may produce bulbous deposits."

[[Wizard.parameters]]
name = "Material"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "Defines the general material of the terrain, ranging from fine sand to large rocks, or a mix of both."

[[Wizard.parameters]]
name = "ChannelDepth"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "This parameter controls the amount of downcutting, or vertical erosion. This results in deeper channels, and can be useful for getting mountain ranges."

[[Wizard.parameters]]
name = "ChannelWidth"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "This parameter controls the width of the channels by creating sediment deposits in the base of the channels."

[[Wizard.parameters]]
name = "Deposits"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "This controls the amount of sedimentary deposits generated by the erosion process."

[[Wizard.parameters]]
name = "Removal"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "This parameter can reduce the amount of sediments generated during erosion, creating deeper channels. "

[[Wizard.parameters]]
name = "Bulk"
type = "enum"
kind = "HorizontalList"
group = "Erosion"
enum = ["Low", "Med", "High", "Ultra"]
enum_values = [0, 1, 2, 3]
description = "Increases the bulk of the terrain before eroding. When using strong settings, having some bulk can help prevent the terrain from eroding too much and losing its shape."

