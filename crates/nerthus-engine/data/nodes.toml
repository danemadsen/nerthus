ConsolidateFlows = 0.5
Bias = 0.5
Snowline = 0.1
Chaos = 0.5
BlurEdges = 0.0
VisualizeData = false
CustomInfluence = 0.0
Trim = 0.1

[[Trees.parameters]]
name = "Output"
type = "enum"
kind = "HorizontalList"
group = "Trees"
group_start = true
enum = ["Instances", "AreaMask"]
enum_values = [0, 1]
description = "Determines the output type for tree placement. 'Instances' provides individual tree positions for rendering and export. 'AreaMask' is an experimental feature that outputs a mask of tree coverage, useful for blending or exclusion but may be less reliable."

[[Trees.parameters]]
name = "TreeCount"
type = "int"
kind = "Standard"
label = "Count in Thousands"
group = "Trees"
min = 10
max = 1000

[[Trees.parameters]]
name = "IsRelative"
type = "bool"
kind = "Standard"
group = "Trees"
description = "If enabled, tree count scales with terrain resolution for consistent density. Recommended for predictable results at higher resolutions, but may increase resource usage."

[[Trees.parameters]]
name = "LODInfo"
type = "string"
kind = "ComputedString"
group = "Trees"
text_format = [true, true, ""]
description = "Provides Level of Detail (LOD) information for tree instances, enabling optimized rendering and export at different distances or resolutions."

[[Trees.parameters]]
name = "TreeSize"
type = "float"
kind = "Standard"
group = "Trees"
min = 0
max = 1
curve = [3]
description = "Controls the height of each tree instance. Affects the appearance of exported trees but not the mask. Useful for adjusting the final look of tree outputs."

[[Trees.parameters]]
name = "TrimUnder"
type = "float"
kind = "Standard"
group = "Trees"
min = 0
max = 1
description = "Removes tree instances below a certain size threshold, clamping down on smaller or weaker trees to refine the mask and output."

[[Trees.parameters]]
name = "Shape"
type = "enum"
kind = "HorizontalList"
group = "Trees"
enum = ["Point", "Big", "BigOnly"]
enum_values = [0, 1, 2]
description = "Specifies the distribution pattern or type of tree shapes. 'Point' is a single pixel, 'Big' is a larger square, and 'BigOnly' restricts placement to large clusters. 'Big' is preferred for mask export, while 'Point' is better for visualization."

[[Trees.parameters]]
name = "Seed"
type = "int"
kind = "Seed"
group = "Trees"
description = "Sets the randomization seed for procedural tree placement. Changing the seed produces different tree layouts and simulation results."

[[Trees.parameters]]
name = "WaterAffinity"
type = "enum"
kind = "HorizontalList"
label = "Seek Water"
group = "Growth"
group_start = true
enum = ["Seek", "Avoid"]
enum_values = [0, 1]

[[Trees.parameters]]
name = "AvoidTrees"
type = "enum"
kind = "HorizontalList"
group = "Growth"
enum = ["None", "Previous", "All"]
enum_values = [0, 1, 2]
description = "Masks out areas occupied by other tree nodes, useful for stacking multiple tree species or biomes without overlap."

[[Trees.parameters]]
name = "Health"
type = "float"
kind = "Standard"
group = "Growth"
min = 0
max = 1
curve = [-3]
description = "Controls the duration and vigor of the tree simulation. Higher health increases density and allows trees to grow into smaller valleys and more challenging terrain. Lower health restricts growth to main flow areas."

[[Trees.parameters]]
name = "Patches"
type = "float"
kind = "Standard"
group = "Growth"
min = 0.0001
max = 1
description = "Clumps trees together into larger groups, creating stylized patches instead of individual trees. Useful for natural-looking forests."

[[Trees.parameters]]
name = "Spread"
type = "float"
kind = "Standard"
group = "Growth"
min = 0.0001
max = 1
description = "Blurs and expands the area where trees can grow, merging small flows into larger masses and creating more natural, contiguous forest areas."

[[Trees.parameters]]
name = "Random"
type = "float"
kind = "Standard"
group = "Growth"
min = 0
max = 1
description = "Adds random noise to tree placement, scattering trees across the terrain without regard to inhibition or aspect controls. Rarely used for realistic masks."

[[Trees.parameters]]
name = "Slope"
type = "float2"
kind = "Standard"
group = "Aspect Inhibition"
group_start = true
min = 0
max = 90
ticks = ["Degrees90"]
description = "Restricts tree growth on steep terrain. Not recommended when using a custom inhibition mask, as the mask provides more accurate control."

[[Trees.parameters]]
name = "SlopeFalloff"
type = "float"
kind = "Standard"
group = "Aspect Inhibition"
min = 0
max = 90
ticks = ["Degrees90"]
description = "Controls how quickly tree density decreases as slope increases. Use with slope inhibition for gradual or sharp transitions."

[[Trees.parameters]]
name = "Altitude"
type = "float2"
kind = "Standard"
group = "Aspect Inhibition"
min = 0
max = 1
separator = true
description = "Sets altitude limits for tree placement, simulating elevation-based growth restrictions. Works well with both aspect inhibition and custom masks."

[[Trees.parameters]]
name = "AltitudeFalloff"
type = "float"
kind = "Standard"
group = "Aspect Inhibition"
min = 0
max = 1
description = "Controls the rate at which tree density decreases with altitude, enabling smooth or sharp transitions in elevation-based inhibition."

[[Trees.parameters]]
name = "Peaks"
type = "float"
kind = "Standard"
group = "Aspect Inhibition"
min = 0
max = 1
separator = true
description = "Removes tree growth from exposed mountain peaks, preventing trees from growing in the most exposed areas."

[[Trees.parameters]]
name = "Strict"
type = "bool"
kind = "Standard"
group = "Aspect Inhibition"
description = "Enforces strict adherence to inhibition rules, resulting in sharper falloff and less natural tree distribution. Use for precise, non-organic masks."

[[Trees.parameters]]
name = "DeadFlow"
type = "float"
kind = "Standard"
group = "Snow Inhibition"
group_start = true
min = 0
max = 1
description = "Represents areas where tree growth is suppressed due to snow mass or adverse conditions. Controls the amount of snow mass moving down the terrain."

[[Trees.parameters]]
name = "ConsolidateFlows"
type = "float"
kind = "Standard"
group = "Snow Inhibition"
min = 0
max = 1
description = "Groups snow flows into larger masses, affecting how far snow moves down the terrain and influencing tree inhibition."

[[Trees.parameters]]
name = "Bias"
type = "float"
kind = "Standard"
group = "Snow Inhibition"
min = 0
max = 1
description = "Directs snow flows to move less or more, affecting the inhibition of tree growth in snowy areas."

[[Trees.parameters]]
name = "Snowline"
type = "float"
kind = "Standard"
group = "Snow Inhibition"
min = 0
max = 1
ticks = ["TerrainMarks"]
separator = true
description = "Defines the altitude at which snow flows start, restricting tree growth above this line."

[[Trees.parameters]]
name = "Chaos"
type = "float"
kind = "Standard"
group = "Artistic Control"
group_start = true
min = 0
max = 1
description = "Warps tree positions for a more natural, randomized look, breaking up straight flows and adding organic variation."

[[Trees.parameters]]
name = "BlurEdges"
type = "float"
kind = "Standard"
group = "Artistic Control"
min = 0
max = 1
description = "Softens and tapers the edges of tree patches, blending them into the terrain for a more natural transition."

[[Trees.parameters]]
name = "VisualizeData"
type = "bool"
kind = "Standard"
group = "Artistic Control"
description = "Enables visualization of tree placement, flows, and snow inhibition, assisting with mask tuning and debugging."

[[Trees.parameters]]
name = "CustomInfluence"
type = "float"
kind = "Standard"
group = "Custom Inhibitors"
group_start = true
min = 0
max = 1
curve = [3]
description = "Applies custom influence maps or masks to control tree placement according to user specifications, enabling highly tailored results."

[[Trees.parameters]]
name = "Trim"
type = "float"
kind = "Standard"
group = "Custom Inhibitors"
min = 0
max = 1
description = "Removes trees from specified areas, allowing for manual or procedural clearing of tree patches for refined mask output."

