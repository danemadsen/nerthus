[Erosion]
type = "Erosion"
name = "Erosion"
display_name = "Erosion"
family = "Erosion"
toolbox = "Simulate"
classification = "Processor"
short_code = "ce"
keywords = ["erosion"]
description = "Erosion is the cornerstone of all terrains. It simulates hydraulic erosion and turns any shape into a realistic-looking terrain."
can_mask = true
members = [
    "Duration",
    "RockSoftness",
    "Strength",
    "Downcutting",
    "Inhibition",
    "BaseLevel",
    "FeatureScale",
    "RealScale",
    "TerrainScale",
    "Verticality",
    "Debris",
    "Volume",
    "SedimentRemoval",
    "AreaEffect",
    "BiasType",
    "Bias",
    "Reverse",
    "Seed",
    "AggressiveMode",
    "Deterministic",
    "Information",
]

[Erosion.defaults]
Duration = 0.04
RockSoftness = 0.65
Strength = 0.5
Downcutting = 0.1
Inhibition = 0.5
BaseLevel = 0.0
FeatureScale = 2000
RealScale = true
TerrainScale = 10000
Verticality = 2000
Debris = 0.0
Volume = 0.0
SedimentRemoval = 0.0
AreaEffect = "None"
BiasType = "Altitude"
Bias = 0.7
Reverse = false
Seed = 22883
AggressiveMode = true
Deterministic = false
Information = 0

[[Erosion.parameters]]
name = "Duration"
type = "float"
kind = "Standard"
group = "Erosion"
group_start = true
min = 0.0001
max = 1
description = "Determines the duration of the erosion simulation. Higher values increase the overall erosion effect, while lower values add subtle erosion details and preserve more of the original landscape."

[[Erosion.parameters]]
name = "RockSoftness"
type = "float"
kind = "Standard"
group = "Erosion"
min = 0.05
max = 1
description = "Controls the softness of the rock material. Softer rocks erode more quickly, resulting in faster and more pronounced erosion."

[[Erosion.parameters]]
name = "Strength"
type = "float"
kind = "Standard"
group = "Erosion"
min = 0.0001
max = 1
description = "Sets the strength of fluvial erosion, controlling the sediment transport capacity. Higher values allow water to carry more dissolved minerals, increasing the rate and impact of erosion."

[[Erosion.parameters]]
name = "Downcutting"
type = "float"
kind = "Standard"
group = "Downcutting"
group_start = true
min = 0
max = 1
description = "Group containing parameters related to the vertical erosion process, where water cuts down into the terrain to form channels and valleys."

[[Erosion.parameters]]
name = "Inhibition"
type = "float"
kind = "Standard"
group = "Downcutting"
min = 0
max = 5
description = "Adds restraints to the downcutting process by slowing it down when undissolved sediments accumulate. This results in a mix of deep channels and alluvial fans, depending on local conditions."

[[Erosion.parameters]]
name = "BaseLevel"
type = "float"
kind = "Standard"
group = "Downcutting"
min = 0
max = 5
description = "Sets the lowest elevation that downcutting can reach before sediment is deposited. This helps fill large valleys and form valley floors, influenced by terrain slope, altitude, and stream velocity."

[[Erosion.parameters]]
name = "FeatureScale"
type = "int"
kind = "Standard"
group = "Scale"
group_start = true
group_collapsed = true
min = 5
max = 20000
description = "Determines the lateral size of the largest erosion features, such as the width of major valleys and ridges, measured in meters."

[[Erosion.parameters]]
name = "RealScale"
type = "bool"
kind = "Standard"
group = "Scale"
description = "Automatically determines the scale from the Terrain Definition, ensuring erosion features are sized appropriately for the terrain."

[[Erosion.parameters]]
name = "TerrainScale"
type = "int"
kind = "Standard"
group = "Scale"
min = 500
max = 20000
description = "Sets the simulated scale of the entire terrain width. Available when Rivers is enabled, this parameter helps match erosion to real-world dimensions."

[[Erosion.parameters]]
name = "Verticality"
type = "int"
kind = "Standard"
group = "Scale"
min = 5
max = 20000
description = "Sets the simulated height of the entire terrain. Available when Rivers is enabled, this parameter controls the vertical exaggeration of erosion features."

[[Erosion.parameters]]
name = "Debris"
type = "float"
kind = "Standard"
group = "Flow"
group_start = true
min = 0
max = 5
description = "Controls the amount and behavior of debris generated and transported during the erosion process."

[[Erosion.parameters]]
name = "Volume"
type = "float"
kind = "Standard"
group = "Flow"
min = 0
max = 5
description = "Alters erosion physics to treat water flows as volumetric, resulting in higher water levels, wider channels, and more extensive sediment deposits. Useful for forming valley floors without downcutting."

[[Erosion.parameters]]
name = "SedimentRemoval"
type = "float"
kind = "Standard"
group = "Flow"
min = 0
max = 1
description = "Removes sediment produced during erosion. This can be modulated using the Sediment Removal mask input to control where sediment is retained or cleared."

[[Erosion.parameters]]
name = "AreaEffect"
type = "enum"
kind = "Enum"
group = "Selective Processing"
group_start = true
enum = ["ErosionStrength", "RockSoftness", "PrecipitationAmount", "None"]
enum_values = [0, 1, 2, 3]
description = "Specifies the effect applied when an Area input or Bias is defined. Determines which erosion property is selectively processed."

[[Erosion.parameters]]
name = "BiasType"
type = "enum"
kind = "HorizontalList"
group = "Selective Processing"
enum = ["Altitude", "Slope"]
enum_values = [0, 1]
description = "Specifies the type of automatic bias to apply when an Area input is not provided. Determines how erosion is distributed based on terrain features."

[[Erosion.parameters]]
name = "Bias"
type = "float"
kind = "Standard"
group = "Selective Processing"
min = 0
max = 1
description = "Sets the strength of the bias. For Slope, this controls the steepness threshold; for Altitude, it sets the position from the bottom of the terrain."

[[Erosion.parameters]]
name = "Reverse"
type = "bool"
kind = "Standard"
group = "Selective Processing"
description = "Reverses the direction of the bias, inverting which areas receive more or less erosion."

[[Erosion.parameters]]
name = "Seed"
type = "int"
kind = "Seed"
group = "Other Settings"
group_start = true
description = "Randomization seed for the erosion process. Changing the seed produces different erosion patterns and channel arrangements."

[[Erosion.parameters]]
name = "AggressiveMode"
type = "bool"
kind = "Standard"
group = "Other Settings"
description = "Enables faster erosion processing at the risk of introducing soft artifacts in minor areas. Useful for quick previews or when speed is prioritized over detail."

[[Erosion.parameters]]
name = "Deterministic"
type = "bool"
kind = "Standard"
group = "Other Settings"
description = "Ensures the erosion simulation produces the same result every time with the same input and seed, improving reproducibility."

[[Erosion.parameters]]
name = "Information"
type = "byte"
kind = "Standard"
group = "Information"
group_start = true
information = "ErosionPro is the recommended Erosion node. Erosion is still a very powerful but uses older technology and may be unable to produce similar results."

