[BlobRemover]
type = "BlobRemover"
name = "BlobRemover"
display_name = "BlobRemover"
family = "Utilities"
toolbox = "Modify"
classification = "Processor"
short_code = "blo"
description = "BlobRemover can remove smaller fragments or blobs near larger shapes. This is very useful for cleanup."
can_mask = true
members = ["Range", "Connectivity", "EnforceQuantization", "Quantization"]

[BlobRemover.defaults]
Range = 0.05
Connectivity = 4
EnforceQuantization = false
Quantization = 64

[[BlobRemover.parameters]]
name = "Range"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Controls the sensitivity of the blob detection. Higher values detect a wider range of blob sizes or intensities."

[[BlobRemover.parameters]]
name = "Connectivity"
type = "int"
kind = "Standard"
min = 4
max = 8
description = "Specifies how connected blobs must be to be considered a single shape. Higher connectivity allows blobs to be more loosely attached to larger shapes."

[[BlobRemover.parameters]]
name = "EnforceQuantization"
type = "bool"
kind = "Standard"
description = "If enabled, forces the use of quantization during blob detection, improving efficiency and consistency in identifying blobs."

[[BlobRemover.parameters]]
name = "Quantization"
type = "int"
kind = "Standard"
min = 16
max = 128
description = "Sets the quantization level for blob detection, with values between 1 and 128. Lower values provide finer detail, while higher values group similar values together for faster and more efficient blob identification."

[[BlobRemover.ports]]
name = "In"
type = "PrimaryIn, Required"
renderintent = "Default"
isexporting = true

[[BlobRemover.ports]]
name = "Out"
type = "PrimaryOut"
renderintent = "Default"
isexporting = true

