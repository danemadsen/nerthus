display_name = "Mountain"
family = "Primitive"
toolbox = "Terrain"
classification = "Generator"
short_code = "m"
keywords = ["mountain"]
description = "Mountain is one of the most versatile primitives, using a modulated Voronoi pattern and distortions to create realistic mountain shapes, ready for further modification and erosion."
flags = ["RequiresBaking"]
gizmo = ["XY", true]
can_mask = true
members = ["Scale", "Height", "Style", "Bulk", "ReduceDetails", "Seed", "X", "Y"]

[Mountain.defaults]
Scale = 0.5
Height = 1.25
Style = "Old"
Bulk = "Medium"
ReduceDetails = false
Seed = 26325
X = 0.5
Y = 0.5

[[Mountain.parameters]]
name = "Scale"
type = "float"
kind = "Standard"
min = 0.0001
max = 1
description = "Controls the overall size and extent of the mountain. Higher values create broader, more expansive mountain shapes."

[[Mountain.parameters]]
name = "Height"
type = "float"
kind = "Standard"
min = 0.0001
max = 3
curve = [2.5]
description = "Sets the maximum elevation of the mountain, determining how tall the peak rises above the terrain."

[[Mountain.parameters]]
name = "Style"
type = "enum"
kind = "HorizontalListNoLabel"
enum = ["Basic", "Eroded", "Old", "Alpine", "Strata"]
enum_values = [0, 1, 2, 3, 4]
description = "Specifies the geological and visual style of the mountain, affecting its shape, erosion, and surface features."

[[Mountain.parameters]]
name = "Bulk"
type = "enum"
kind = "HorizontalList"
enum = ["Low", "Medium", "High"]
enum_values = [0, 1, 2]
description = "Controls the mass and volume of the mountain, affecting how thick or substantial the formation appears."

[[Mountain.parameters]]
name = "ReduceDetails"
type = "bool"
kind = "Standard"
description = "Reduces the amount of fine surface detail on the mountain, resulting in a smoother, more simplified shape."

[[Mountain.parameters]]
name = "Seed"
type = "int"
kind = "Seed"
description = "Randomization seed for generating unique variations of the mountain. Changing the seed produces different shapes and arrangements."

[[Mountain.parameters]]
name = "X"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Offsets the mountain horizontally along the X axis, shifting its position within the terrain."

[[Mountain.parameters]]
name = "Y"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Offsets the mountain horizontally along the Y axis, shifting its position within the terrain."

