[Cellular]
type = "Cellular"
name = "Cellular"
display_name = "Cellular"
family = "Extended"
toolbox = "Primitive"
classification = "Generator"
short_code = "ll"
keywords = ["cellular"]
description = "Cellular creates cell-based patterns and noises that can be quite versatile as they're ever-present in nature."
flags = ["RequiresBaking"]
can_mask = true
members = [
    "Size",
    "Density",
    "Jitter",
    "MetricMorph",
    "DistanceMetric",
    "CoordinateAxesJitter",
    "CAJClustering",
    "Anisotropy",
    "DistanceFunction",
    "Seed",
]

[Cellular.defaults]
Size = 0.25
Density = 1
Jitter = 1.0
MetricMorph = 1.0
DistanceMetric = "Euclidian_Chebyshev"
CoordinateAxesJitter = 1.0
CAJClustering = 1.0
Anisotropy = 0.0
DistanceFunction = "Hash"
Seed = 15743

[[Cellular.parameters]]
name = "Size"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Controls the overall scale of the cellular pattern. Higher values produce smaller cells (finer detail); lower values produce larger cells (coarser detail)."

[[Cellular.parameters]]
name = "Density"
type = "int"
kind = "Standard"
min = 0
max = 10
description = "Controls how many feature points are generated per area. Higher density creates more, smaller cells; lower density creates fewer, larger cells."

[[Cellular.parameters]]
name = "Jitter"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Randomizes feature-point placement. Low values are more uniform/structured; higher values create more organic, irregular cells."

[[Cellular.parameters]]
name = "MetricMorph"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Blends between the paired distance behaviors implied by the selected Distance Metric (e.g., Euclidian ↔ Manhattan/Chebyshev), changing cell geometry continuously."

[[Cellular.parameters]]
name = "DistanceMetric"
type = "enum"
kind = "Enum"
enum = ["Euclidian_Manhattan", "Euclidian_Chebyshev", "Minkowski"]
enum_values = [0, 1, 2]
description = "Selects the distance-space used to evaluate the cellular field, affecting the fundamental shape of cells and borders."

[[Cellular.parameters]]
name = "CoordinateAxesJitter"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Adds jitter in coordinate/axis space before evaluation, warping the field and introducing directional wobble and boundary distortion."

[[Cellular.parameters]]
name = "CAJClustering"
type = "float"
kind = "Standard"
min = 1
max = 5
description = "Controls how Coordinate Axes Jitter groups together. Low values spread distortion evenly; higher values create patchy/clumped distortion regions."

[[Cellular.parameters]]
name = "Anisotropy"
type = "float"
kind = "Standard"
min = 0
max = 1
description = "Stretches the pattern directionally, producing elongated/elliptical cells and emphasizing a dominant direction."

[[Cellular.parameters]]
name = "DistanceFunction"
type = "enum"
kind = "Enum"
enum = ["Hash", "DistanceInv", "Distance2Inv", "DistanceDiff", "DistanceToEdge"]
enum_values = [0, 1, 2, 3, 4]
description = "Defines what value is output from the cellular field (cell IDs, distances to points, borders, or edges)."

[[Cellular.parameters]]
name = "Seed"
type = "int"
kind = "Seed"
description = "Changes the random distribution of feature points without changing other settings."

[[Cellular.ports]]
name = "In"
type = "PrimaryIn"
renderintent = "Default"
isexporting = true

[[Cellular.ports]]
name = "Out"
type = "PrimaryOut"
renderintent = "Default"
isexporting = true

