[Mesher]
type = "Mesher"
name = "Mesher"
display_name = "Mesher"
family = "Assets"
toolbox = "Output"
classification = "Export"
short_code = "me"
icon = "x-mesher"
description = "Mesher can save specific nodes as meshes instead of heightfields, and can also generate LODs."
can_mask = false
members = [
    "Format",
    "Scale",
    "Topology",
    "VerticesPerSide",
    "ArtifactReduction",
    "CreateNormals",
    "CreateUVs",
    "UVOrigin",
    "CreateWalls",
    "CenterPivot",
    "LevelOfDetail",
    "Information",
]

[Mesher.defaults]
Format = "OBJ"
Scale = "Normalized"
Topology = "AdaptiveTris"
VerticesPerSide = 2048
ArtifactReduction = "None"
CreateNormals = false
CreateUVs = false
UVOrigin = "BottomLeft"
CreateWalls = false
CenterPivot = true
LevelOfDetail = "None"
Information = 0

[[Mesher.parameters]]
name = "Format"
type = "enum"
kind = "HorizontalList"
enum = ["OBJ", "FBX", "DAE", "GLTF", "GLB"]
enum_values = [0, 1, 2, 3, 4]
description = "Specifies the file format for the exported mesh. Choose the format that best fits your workflow or target application."

[[Mesher.parameters]]
name = "Scale"
type = "enum"
kind = "HorizontalList"
enum = ["Normalized", "Meter", "Kilometer"]
enum_values = [0, 1, 2]
description = "Sets the unit or normalization method for the exported mesh coordinates, determining how the model's size is interpreted."

[[Mesher.parameters]]
name = "Topology"
type = "enum"
kind = "HorizontalList"
enum = ["Tris", "Quads", "AdaptiveTris"]
enum_values = [0, 1, 2]
enum_descriptions = { AdaptiveTris = "Adaptive (Sophia)" }
force_regenerate = true
description = "Specifies the type of mesh topology used for the exported model, affecting how the surface is constructed and rendered."

[[Mesher.parameters]]
name = "TopologyWarning"
type = "string"
kind = "ComputedString"

[[Mesher.parameters]]
name = "VerticesPerSide"
type = "int"
kind = "Standard"
min = 64
max = 16384
force_regenerate = true
description = "Sets the resolution of the mesh by specifying the number of vertices along each side. Higher values increase detail but also file size."

[[Mesher.parameters]]
name = "ArtifactReduction"
type = "enum"
kind = "HorizontalList"
enum = ["None", "Low", "Med"]
enum_values = [0, 1, 2]
description = "Applies post-processing to reduce visual artifacts in the mesh, such as smoothing or correcting problematic geometry."

[[Mesher.parameters]]
name = "CreateNormals"
type = "bool"
kind = "Standard"
separator = true
description = "If enabled, generates normal vectors for the mesh, improving shading and rendering quality in 3D applications."

[[Mesher.parameters]]
name = "CreateUVs"
type = "bool"
kind = "Standard"
label = "Create UVs"

[[Mesher.parameters]]
name = "UVOrigin"
type = "enum"
kind = "Enum"
enum = ["TopLeft", "BottomLeft"]
enum_values = [0, 1]
description = "Specifies the origin point for the UV coordinate system, affecting how textures are mapped onto the mesh."

[[Mesher.parameters]]
name = "CreateWalls"
type = "bool"
kind = "Standard"
separator = true
description = "Creates vertical walls along the edges of the mesh, useful for generating closed or extruded terrain models."

[[Mesher.parameters]]
name = "CenterPivot"
type = "bool"
kind = "Standard"
description = "If enabled, centers the mesh's pivot point at the origin, making it easier to manipulate in 3D applications."

[[Mesher.parameters]]
name = "LevelOfDetail"
type = "enum"
kind = "Enum"
enum = ["None", "LOD1", "LOD2", "LOD3", "LOD4", "LOD5", "LOD6"]
enum_values = [0, 1, 2, 3, 4, 5, 6]
separator = true
force_regenerate = true
description = "Specifies the level of detail (LOD) for the exported mesh, allowing for simplified versions to be generated for performance optimization."

[[Mesher.parameters]]
name = "LODInfo"
type = "string"
kind = "ComputedString"
text_format = [false, true, ""]

[[Mesher.parameters]]
name = "Information"
type = "byte"
kind = "Standard"
separator = true
information = "Use the TextureBaker node to generate Tangent-space Normals and bake bitmaps for this mesh."

[[Mesher.ports]]
name = "In"
type = "PrimaryIn, Required"
renderintent = "Default"
isexporting = true

[[Mesher.ports]]
name = "Out"
type = "PrimaryOut"
renderintent = "Default"
isexporting = true

[Meshify]
type = "Meshify"
name = "Meshify"
display_name = "Meshify"
family = "Shape"
toolbox = "Modify"
classification = "Processor"
short_code = "msf"
keywords = ["meshify"]
description = "Converts terrain into a faceted, mesh-like surface with controllable vertex density and detail sensitivity."
version = 1
can_mask = true
members = ["Vertices", "Seed", "DetailSensitivity"]

[Meshify.defaults]
Vertices = 10000.0
Seed = 14896
DetailSensitivity = 0.5

[[Meshify.parameters]]
name = "Vertices"
type = "float"
kind = "Standard"
group = "Meshify"
group_start = true
min = 4
max = 1000000
curve = [8]
description = "Sets the number of vertices used to construct the mesh facets. Higher values produce finer, more detailed meshes; lower values create larger, more pronounced facets."

[[Meshify.parameters]]
name = "Seed"
type = "int"
kind = "Seed"
group = "Meshify"
description = "Randomization seed for mesh facet arrangement. Changing the seed produces different polygonal patterns and facet layouts."

[[Meshify.parameters]]
name = "DetailSensitivity"
type = "float"
kind = "Standard"
group = "Meshify"
min = 0
max = 1
description = "Controls how closely the mesh facets follow the underlying terrain detail. Higher sensitivity preserves more terrain features; lower sensitivity results in smoother, more abstract faceting."

[[Meshify.ports]]
name = "In"
type = "PrimaryIn, Required"
renderintent = "Default"
isexporting = true

