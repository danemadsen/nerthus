[package]
name = "nerthus-export"
description = "Build and Export for Nerthus: output file formats, build destinations and the export build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nerthus-assimp.workspace = true
nerthus-engine.workspace = true
nerthus-image.workspace = true
nerthus-nodes.workspace = true
chrono.workspace = true
crc32fast = "1.5.2"
directories.workspace = true
flate2.workspace = true
half.workspace = true
jpeg-encoder = "0.7.1"
log.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
uuid.workspace = true
web-time.workspace = true

# The machine's name, which browsers do not give.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gethostname.workspace = true
